<!-- Targamgi ikinci ekran: telefon ya da tablet tarayıcısında büyük, okunaklı canlı altyazı. Bilgisayar ve telefon
     uygulaması bu dosyayı /view?k=<erişim anahtarı> adresinden verir (aynı dosya); internet gerekmez, altyazılar aynı
     ağdaki Targamgi'ın /events akışından gelir. Anahtarsız istek sunucuda reddedilir. -->
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<title>Targamgi</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  /* Altyazı ekranın ortasında: telefon monitörün yanında ya da masada dururken göz hep aynı yere bakar. */
  #stage {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; box-sizing: border-box;
    padding: 16px 20px; /* TV browsers: no max()/env() */
    padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0.6em;
  }
  #previous {
    max-width: 100%; text-align: center; white-space: pre-line; overflow-wrap: anywhere;
    font-weight: 500; line-height: 1.25; color: rgba(255, 255, 255, 0.45); font-size: 24px; word-wrap: break-word;
    min-height: 1.25em;
  }
  #line {
    max-width: 100%; text-align: center; white-space: pre-line; overflow-wrap: anywhere;
    font-weight: 600; line-height: 1.22; font-size: 48px; word-wrap: break-word;
    opacity: 0; transition: opacity 0.15s;
  }
  #line.on { opacity: 1; }
  #line.bold { font-weight: 800; }
  #status {
    position: absolute; left: 0; right: 0; bottom: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; font-size: 15px; color: rgba(255, 255, 255, 0.5);
  }
  #status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
    background: #8a8a8a; vertical-align: 1px;
  }
  #status.live .dot { background: #34c759; }
  #status.lost .dot { background: #ff453a; }
  #status.quiet { opacity: 0; transition: opacity 0.6s; }

#line, #previous { unicode-bidi: plaintext; }
bdi { unicode-bidi: isolate; }

/* Separate RTL speaker labels; dialogue keeps its own bidi context and white color. */
.arabic-turn { display: flex; flex-direction: row; direction: rtl; unicode-bidi: isolate;
  align-items: baseline; justify-content: center; max-width: 100%; text-align: right; }
.arabic-speaker-label { flex: 0 1 auto; min-width: 0; max-width: 32%; padding-left: .28em;
  font-size: 1.15em; font-weight: 800; direction: rtl; unicode-bidi: isolate; white-space: normal; }
.arabic-dialogue { flex: 0 1 auto; min-width: 0; direction: rtl; unicode-bidi: isolate;
  font-weight: 600; color: #FFFFFF; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word; }
.arabic-turn { text-shadow: 0 1px 3px #000, 0 0 2px #000; }

#line, #previous { box-sizing: border-box; min-width: 55%; max-width: 100%; padding: .18em .45em; background: rgba(0,0,0,.88); border-radius: .15em; }
</style>
</head>
<body>
<div id="stage"><div id="previous"></div><div id="line"></div></div>
<div id="status"><span class="dot"></span><span id="status-text" dir="auto"></span></div>
<script>
(function () {
  'use strict';
  // Targamgi: Arabic by default; English only when the browser language is English.
  var english = /^en/i.test(navigator.language || '');
  var TEXT = english
    ? { connecting: 'Connecting…', live: 'Connected. Subtitles will appear here.', lost: 'Connection lost, retrying…',
        hint: 'Tap for full screen.' }
    : { connecting: 'جارٍ الاتصال…', live: 'متصل. ستظهر الترجمة هنا.', lost: 'انقطع الاتصال، جارٍ إعادة المحاولة…',
        hint: 'اضغط لعرض ملء الشاشة.' };
  document.documentElement.lang = english ? 'en' : 'ar';

  var stage = document.getElementById('stage');
  var line = document.getElementById('line');
  var previous = document.getElementById('previous');
  var status = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var timer = null;
  var quietTimer = null;
  var current = '';
  var color = '#ffffff';

  function setStatus(state) {
    status.className = state;
    statusText.textContent = TEXT[state] + (state === 'live' && canFullscreen() ? ' ' + TEXT.hint : '');
    clearTimeout(quietTimer);
    // Bağlıyken bilgi satırı birkaç saniye sonra kaybolur; altyazının dikkatini dağıtmasın.
    if (state === 'live') quietTimer = setTimeout(function () { status.className = 'live quiet'; }, 6000);
  }

  // Konuşanın adı ve rengi ([{name, color}]); geçersiz öğeler atlanır.
  function speakerMap(list) {
    if (!list || typeof list.length !== 'number') return null;
    var map = null;
    for (var i = 0; i < list.length && i < 16; i++) {
      var item = list[i];
      if (!item || typeof item.name !== 'string' || !item.name || item.name.length > 40) continue;
      if (typeof item.color !== 'string' || !/^#[0-9A-Fa-f]{6}$/.test(item.color)) continue;
      map = map || {};
      map[item.name] = item.color;
    }
    return map;
  }

  function bidi(text) {
    if (!/[\u0600-\u06ff]/.test(text)) return text;
    return text.replace(/[A-Za-z][A-Za-z0-9'’ .-]*/g, function (latin) { return '\u2068' + latin.trim() + '\u2069' + (/ $/.test(latin) ? ' ' : ''); });
  }

  // Satır başındaki "Ad:" konuşanın renginde; renk o satırın sonuna kadar sürer.
  // Arabic labels and dialogue are separate elements, with an explicit RTL row.
  function arabicLabelColor(name) {
    var fixed = { 'Jason': '#4FC3F7', 'جيسون': '#4FC3F7', 'Lucia': '#FF8A80', 'لوسيا': '#FF8A80',
      'Brian': '#81C784', 'برايان': '#81C784', 'Doug': '#FFD54F', 'دوغ': '#FFD54F' };
    if (Object.prototype.hasOwnProperty.call(fixed, name)) return fixed[name];
    var hash = 2166136261, key = name.trim().toLowerCase();
    for (var i = 0; i < key.length; i++) { hash ^= key.charCodeAt(i); hash = (hash + (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24)) >>> 0; }
    return ['#FFD54F','#4FC3F7','#81C784','#FF8A65','#CE93D8','#F06292','#4DD0E1','#AED581','#FFB74D','#90CAF9'][hash % 10];
  }

  function arabicTurns(text) {
    var turns = [], lines = text.replace(/[\u2066-\u2069]/g, '').split('\n');
    var headings = /^(?:الهدف|المهمة|هدف|مهمة|ملاحظة|تنبيه|تحذير|تلميح|الوقت|الرابط|Objective|Objectives|Note|Warning|Tip|Hint|Mission|Task|Time|Status|Info|https?|ftp)$/i;
    for (var i = 0; i < lines.length; i++) {
      var match = /^([A-Z\u00c0-\u024f\u0600-\u06ff][A-Za-z\u00c0-\u024f\u0600-\u06ff .’'\-]{0,47})\s*[:：]\s*(.+)$/.exec(lines[i].trim());
      var name = match ? match[1].trim() : '';
      if (match && name.split(/\s+/).length <= 3 && !headings.test(name) && match[2].charAt(0) !== '/' && /[A-Za-z\u0600-\u06ff]/.test(match[2])) {
        var names = { 'Jason':'جيسون', 'Lucia':'لوسيا', 'Brian':'برايان', 'Doug':'دوغ', 'Kingfishers':'كينغفيشرز' };
        name = Object.prototype.hasOwnProperty.call(names, name) ? names[name] : name;
        turns.push({ name: name, body: match[2] });
      } else if (turns.length) turns[turns.length - 1].body += '\n' + lines[i];
      else turns.push({ name: null, body: lines[i] });
    }
    return turns;
  }

  function paintArabicSpeakers(el, text) {
    if (!/[\u0600-\u06ff]/.test(text)) { el.style.direction = ''; el.style.unicodeBidi = ''; el.removeAttribute('data-arabic'); return false; }
    el.textContent = '';
    el.style.direction = 'rtl';
    el.setAttribute('data-arabic', 'true');
    el.style.unicodeBidi = 'isolate';
    var turns = arabicTurns(text);
    for (var i = 0; i < turns.length; i++) {
      var row = document.createElement('div');
      row.className = 'arabic-turn'; row.dir = 'rtl';
      if (turns[i].name) {
        var label = document.createElement('span');
        label.className = 'arabic-speaker-label'; label.dir = 'rtl';
        label.style.color = arabicLabelColor(turns[i].name);
        label.textContent = '\u2068' + turns[i].name + ':\u2069';
        row.appendChild(label);
      }
      var body = document.createElement('span');
      body.className = 'arabic-dialogue'; body.dir = 'rtl';
      body.textContent = turns[i].body.replace(/[A-Za-z][A-Za-z0-9'’ .-]*/g, function (latin) {
        return '\u2068' + latin.trim() + '\u2069' + (/ $/.test(latin) ? ' ' : '');
      });
      row.appendChild(body);
      el.appendChild(row);
    }
    return true;
  }

  function paint(el, text, map) {
    if (paintArabicSpeakers(el, text)) return;
    el.textContent = '';
    var lines = text.split('\n');
    var running = null;
    for (var i = 0; i < lines.length; i++) {
      if (i > 0) el.appendChild(document.createTextNode('\n'));
      var found = null;
      if (map) {
        for (var name in map) {
          if (!Object.prototype.hasOwnProperty.call(map, name)) continue;
          var rest = lines[i].substr(name.length);
          if (lines[i].substr(0, name.length) === name && /^ ?[:：]/.test(rest) && (!found || name.length > found.length)) found = name;
        }
      }
      if (found) running = map[found];
      if (!running) { el.appendChild(document.createTextNode(bidi(lines[i]))); continue; }
      var span = document.createElement('span');
      span.style.color = running;
      span.textContent = bidi(lines[i]);
      el.appendChild(span);
    }
  }

  // Yazı ekrana en çok iki satırda sığacak en büyük boyda: önce ekrana göre büyük başlar, sığmazsa küçülür.
  function fit(el, maxLines) {
    var width = stage.clientWidth - 40;
    var height = stage.clientHeight;
    var size = Math.max(24, Math.min(width / 9, height / 3.2));
    var floor = 18;
    el.style.fontSize = size + 'px';
    for (var i = 0; i < 40 && size > floor; i++) {
      var lineHeight = parseFloat(getComputedStyle(el).lineHeight) || size * 1.22;
      if (el.scrollHeight <= lineHeight * maxLines + 1 && el.scrollWidth <= width + 1) break;
      size = Math.max(floor, size * 0.92);
      el.style.fontSize = size + 'px';
    }
    previous.style.fontSize = Math.max(16, size * 0.45) + 'px';
  }

  function show(text, duration, speakers) {
    clearTimeout(timer);
    if (!text) return hide();
    if (current && current !== text) paint(previous, current, null);
    current = text;
    // Uygulamanın satır bölmesi tarayıcı genişliğine uymaz: satırlar birleşir, bölmeyi tarayıcı yapar
    // (konuşan satırları, "Ad:" ile başlayanlar, ayrı kalır).
    var joined = text.split('\n').reduce(function (all, part) {
      if (!all.length) return [part];
      return /^\S[^:\n]{0,39} ?[:：]/.test(part) ? all.concat([part]) : all.slice(0, -1).concat([all[all.length - 1] + ' ' + part]);
    }, []).join('\n');
    paint(line, joined, speakerMap(speakers));
    line.style.color = color;
    line.className = 'on' + (bold ? ' bold' : '');
    fit(line, 2);
    if (duration > 0) timer = setTimeout(hide, Math.min(duration, 60000));
  }

  function hide() {
    clearTimeout(timer);
    if (current) paint(previous, current, null);
    current = '';
    line.className = '';
  }

  var bold = false;
  function applyStyle(style) {
    if (!style) return;
    color = style.textColor === 'yellow' ? '#ffe135' : '#ffffff';
    bold = !!style.bold;
    if (current) { line.style.color = color; line.className = 'on' + (bold ? ' bold' : ''); fit(line, 2); }
  }

  function canFullscreen() {
    var root = document.documentElement;
    return !!(root.requestFullscreen || root.webkitRequestFullscreen);
  }

  // Dokununca tam ekran (tarayıcı destekliyorsa); yeniden dokununca çıkar.
  document.addEventListener('click', function () {
    var root = document.documentElement;
    var active = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (active) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else if (root.requestFullscreen) root.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
      else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
    } catch (err) {}
    keepAwake();
  });

  // Ekran açık kalsın (Wake Lock API varsa; sekme arka plana gidince kilit düşer, geri gelince yeniden istenir).
  var lock = null;
  function keepAwake() {
    if (lock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (made) {
      lock = made;
      made.addEventListener('release', function () { lock = null; });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', keepAwake);
  keepAwake();

  window.addEventListener('resize', function () { if (current) fit(line, 2); });

  // Regex, not URLSearchParams: older TV browsers (Chromium 38-48) lack it.
  var keyMatch = /[?&]k=([^&]*)/.exec(location.search);
  var key = keyMatch ? decodeURIComponent(keyMatch[1]) : '';
  setStatus('connecting');
  var events = new EventSource('/events?viewer=second&k=' + encodeURIComponent(key));
  events.onopen = function () { setStatus('live'); };
  events.onerror = function () { setStatus('lost'); };
  events.addEventListener('style', function (e) { try { applyStyle(JSON.parse(e.data)); } catch (err) {} });
  events.addEventListener('subtitle', function (e) {
    try { var d = JSON.parse(e.data); show(d.text, d.duration, d.speakers); } catch (err) {}
  });
  events.addEventListener('clear', hide);
  // "Ekranı çevir" sonuçları da yazı olarak gösterilir (yerleri telefonda anlamsız).
  events.addEventListener('screen', function (e) {
    try {
      var d = JSON.parse(e.data);
      var texts = (d.items || []).map(function (item) { return item && item.text; }).filter(Boolean);
      if (texts.length) show(texts.join('\n'), d.duration);
    } catch (err) {}
  });
  events.addEventListener('screen-clear', hide);
})();
</script>
</body>
</html>
